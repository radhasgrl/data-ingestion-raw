# Customer domain's parameter values for the Snowpipe ingestion pattern
# (patterns/snowpipe/sql/*.sql). Zero SQL here — onboarding a new domain onto this pattern
# is just a new sources/<domain>/snowpipe-params.yml with these same keys.
domain: "CUSTOMER"
domain_label: "customer"
database: "DEV_CUSTOMER_DB"
bucket_prefix: ""
bucket_prefix_comment: ""
table: "CUSTOMERS"
stage_name: "CUSTOMER_RAW_STAGE"
pipe_name: "CUSTOMER_INGEST_PIPE"
file_format_name: "CUSTOMER_CSV_FORMAT"
integration_name: "CUSTOMER_RAW_S3_INTEGRATION"
role: "DEV_CUSTOMER_INGEST_SERVICE_PRSN"
warehouse: "DEV_CUSTOMER_INGEST_WH"
user: "GITHUB_DEV_INGEST_SVC"
