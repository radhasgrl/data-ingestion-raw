name: Deploy API

# Sibling of deploy-snowpipe.yml for a custom API-polling ingestion pattern — see
# patterns/api/README.md. Dormant by design: patterns/api/active_domains.json is empty, so
# the detect-domains job below always resolves to "[]" and the deploy job never runs. This
# file exists to prove the "one workflow per ingestion pattern" structure generalizes
# beyond Snowpipe, without fabricating a fake API ingestion deployment.

on:
  push:
    branches: [main]
    paths:
      - "patterns/api/**"
      - "sources/**/api-params.yml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  detect-domains:
    name: Detect Changed Domains
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.detect.outputs.domains }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect which ingestion domains changed
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DOMAINS=$(bash detect-changed-domains.sh api ALL)
          else
            DOMAINS=$(bash detect-changed-domains.sh api "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "Domains to deploy: $DOMAINS"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"

  # Never actually runs today — patterns/api/active_domains.json is empty. Once a real
  # API-polling domain is onboarded (see patterns/api/README.md), this job activates with
  # zero changes needed here.
  deploy:
    name: Deploy API objects (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: detect-domains
    if: needs.detect-domains.outputs.domains != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-domains.outputs.domains) }}
    environment:
      name: ${{ matrix.github_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Not yet implemented
        run: |
          echo "::error::patterns/api/ has no deployable artifacts yet — this step should be unreachable (active_domains.json should be empty)."
          exit 1
