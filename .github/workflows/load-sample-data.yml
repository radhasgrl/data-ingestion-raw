name: Load Sample Data (demo)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  load:
    name: Upload sample CSV + refresh pipe
    runs-on: ubuntu-latest
    environment:
      name: DEV-Ingest

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_DEV_INGEST_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525218385225:role/data-ingestion-raw-github-oidc
          aws-region: ap-southeast-2

      - name: Upload sample CSV to S3
        run: |
          aws s3 cp sample-data/customers_sample.csv \
            "s3://data-ingestion-raw-525218385225/customers_sample_$(date +%s).csv"

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role DEV_CUSTOMER_INGEST_SERVICE_PRSN \
            --warehouse DEV_INGEST_WH \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      - name: Refresh pipe (manual-trigger Snowpipe)
        run: snow sql -q "ALTER PIPE DEV_CUSTOMER_DB.RAW.CUSTOMER_INGEST_PIPE REFRESH;"

      # ALTER PIPE ... REFRESH is asynchronous (it queues files; COPY happens in the
      # background). Poll SYSTEM$PIPE_STATUS until pendingFileCount reaches 0 instead of
      # guessing a fixed sleep duration — a fixed `sleep 20` showed ROW_COUNT=0 on a slow
      # run during initial testing of this pipeline, which would look like a failed demo
      # on stage even though the load was simply still in flight.
      - name: Wait for Snowpipe to finish processing (poll, not a fixed sleep)
        run: |
          for i in $(seq 1 24); do
            RAW_JSON=$(snow sql -q "SELECT SYSTEM\$PIPE_STATUS('DEV_CUSTOMER_DB.RAW.CUSTOMER_INGEST_PIPE') AS STATUS;" --format json)
            PENDING=$(echo "$RAW_JSON" | jq -r '.[0].STATUS' | jq -r '.pendingFileCount')
            echo "Attempt $i/24: pendingFileCount=$PENDING"
            if [ "$PENDING" = "0" ]; then
              echo "Snowpipe has finished processing all queued files."
              break
            fi
            sleep 5
          done
          if [ "$PENDING" != "0" ]; then
            echo "::warning::Snowpipe still reports $PENDING pending file(s) after 2 minutes of polling — the row count check below may be stale. Re-run this workflow or check SYSTEM\$PIPE_STATUS manually."
          fi

      - name: Verify row count
        run: snow sql -q "SELECT COUNT(*) AS row_count FROM DEV_CUSTOMER_DB.RAW.CUSTOMERS;"

      - name: Diagnostic - copy history (temporary, investigating zero-row result)
        run: |
          snow sql -q "SELECT FILE_NAME, STATUS, ROW_COUNT, ROW_PARSED, FIRST_ERROR_MESSAGE, LAST_LOAD_TIME FROM TABLE(INFORMATION_SCHEMA.COPY_HISTORY(TABLE_NAME=>'DEV_CUSTOMER_DB.RAW.CUSTOMERS', START_TIME=>DATEADD('hour', -1, CURRENT_TIMESTAMP()))) ORDER BY LAST_LOAD_TIME DESC;"
