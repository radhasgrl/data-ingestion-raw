name: Load Sample Data (demo)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to load sample data into (folder name under sources/)"
        required: true
        default: "customer"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  load:
    name: Upload sample CSV + refresh pipe
    runs-on: ubuntu-latest
    # Customer kept its original, unprefixed GitHub Environment name (DEV-Ingest) rather
    # than being renamed to the domain-prefixed convention — same reasoning as Customer's
    # GITHUB_DEV_INGEST_SVC identity keeping its legacy name in Repo 1's
    # terraform/domain_identities.tf. Every domain after Customer follows the standard
    # DEV-Ingest-<Domain> convention.
    environment:
      name: ${{ inputs.domain == 'customer' && 'DEV-Ingest' || format('DEV-Ingest-{0}', inputs.domain) }}

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load domain params (YAML -> JSON)
        id: config
        run: |
          PARAMS_FILE="sources/${{ inputs.domain }}/snowpipe-params.yml"
          if [ ! -f "$PARAMS_FILE" ]; then
            echo "::error::No such domain '${{ inputs.domain }}' on the Snowpipe pattern (expected $PARAMS_FILE to exist)"
            exit 1
          fi
          pip install --quiet pyyaml
          python3 -c "import yaml, json; print(json.dumps(yaml.safe_load(open('${PARAMS_FILE}'))))" > params.json
          echo "database=$(jq -r .database params.json)" >> "$GITHUB_OUTPUT"
          echo "table=$(jq -r .table params.json)" >> "$GITHUB_OUTPUT"
          echo "pipe_name=$(jq -r .pipe_name params.json)" >> "$GITHUB_OUTPUT"
          echo "bucket_prefix=$(jq -r .bucket_prefix params.json)" >> "$GITHUB_OUTPUT"
          echo "user=$(jq -r .user params.json)" >> "$GITHUB_OUTPUT"
          echo "role=$(jq -r .role params.json)" >> "$GITHUB_OUTPUT"
          echo "warehouse=$(jq -r .warehouse params.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525218385225:role/data-ingestion-raw-github-oidc
          aws-region: ap-southeast-2

      - name: Upload sample CSV to S3
        id: upload
        run: |
          FILE_NAME="customers_sample_$(date +%s).csv"
          aws s3 cp sample-data/customers_sample.csv \
            "s3://data-ingestion-raw-525218385225/${{ steps.config.outputs.bucket_prefix }}${FILE_NAME}"
          echo "file_name=${FILE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "${{ steps.config.outputs.user }}" \
            --role "${{ steps.config.outputs.role }}" \
            --warehouse "${{ steps.config.outputs.warehouse }}" \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      - name: Refresh pipe (manual-trigger Snowpipe)
        run: snow sql -q "ALTER PIPE ${{ steps.config.outputs.database }}.RAW.${{ steps.config.outputs.pipe_name }} REFRESH;"

      # Polls COPY_HISTORY for the SPECIFIC file this run just uploaded, rather than
      # pendingFileCount (a pipe-wide counter that hits 0 a moment before the triggering
      # file's own COPY actually commits — observed repeatedly in testing: pendingFileCount
      # reaches 0, but this exact file isn't yet in COPY_HISTORY as 'Loaded' for several
      # more seconds, which a blind `SELECT COUNT(*)` right after has no way to detect).
      # This is a strictly more reliable signal: it waits for *this run's own file*,
      # not an aggregate counter, and distinguishes a genuine load failure (fails fast) from
      # "still in flight" (keeps polling).
      - name: Wait for this run's file to appear in COPY_HISTORY
        id: copy_status
        run: |
          DATABASE="${{ steps.config.outputs.database }}"
          TABLE="${{ steps.config.outputs.table }}"
          FILE_NAME="${{ steps.upload.outputs.file_name }}"
          STATUS=""
          for i in $(seq 1 24); do
            RESULT=$(snow sql --format json -q "
              SELECT status, row_count, first_error_message
              FROM TABLE(${DATABASE}.INFORMATION_SCHEMA.COPY_HISTORY(
                TABLE_NAME=>'${DATABASE}.RAW.${TABLE}',
                START_TIME=>DATEADD(hours, -1, CURRENT_TIMESTAMP())
              ))
              WHERE file_name = '${FILE_NAME}'
              ORDER BY last_load_time DESC
              LIMIT 1;
            ")
            STATUS=$(echo "$RESULT" | jq -r '.[0].STATUS // empty')
            echo "Attempt $i/24: status for ${FILE_NAME} = '${STATUS:-not yet visible}'"

            if [ "$STATUS" = "Loaded" ]; then
              ROW_COUNT=$(echo "$RESULT" | jq -r '.[0].ROW_COUNT')
              echo "File loaded successfully: ${ROW_COUNT} row(s)."
              echo "row_count=${ROW_COUNT}" >> "$GITHUB_OUTPUT"
              break
            elif [ "$STATUS" = "Load failed" ] || [ "$STATUS" = "Partially loaded" ]; then
              ERROR_MSG=$(echo "$RESULT" | jq -r '.[0].FIRST_ERROR_MESSAGE // "no error message"')
              echo "::error::Snowpipe load for ${FILE_NAME} ended with status '${STATUS}': ${ERROR_MSG}"
              exit 1
            fi
            sleep 5
          done

          if [ "$STATUS" != "Loaded" ]; then
            echo "::error::${FILE_NAME} still not showing as 'Loaded' in COPY_HISTORY after 2 minutes of polling (last status: '${STATUS:-none}')."
            exit 1
          fi

      - name: Verify row count
        run: |
          echo "Rows loaded by this run's file: ${{ steps.copy_status.outputs.row_count }}"
          snow sql -q "SELECT COUNT(*) AS total_row_count FROM ${{ steps.config.outputs.database }}.RAW.${{ steps.config.outputs.table }};"
