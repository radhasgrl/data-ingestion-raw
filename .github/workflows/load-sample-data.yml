name: Load Sample Data (demo)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to load sample data into (folder name under sources/)"
        required: true
        default: "customer"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  load:
    name: Upload sample CSV + refresh pipe
    runs-on: ubuntu-latest
    # Customer kept its original, unprefixed GitHub Environment name (DEV-Ingest) rather
    # than being renamed to the domain-prefixed convention — same reasoning as Customer's
    # GITHUB_DEV_INGEST_SVC identity keeping its legacy name in Repo 1's
    # terraform/domain_identities.tf. Every domain after Customer follows the standard
    # DEV-Ingest-<Domain> convention.
    environment:
      name: ${{ inputs.domain == 'customer' && 'DEV-Ingest' || format('DEV-Ingest-{0}', inputs.domain) }}

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load domain params (YAML -> JSON)
        id: config
        run: |
          PARAMS_FILE="sources/${{ inputs.domain }}/snowpipe-params.yml"
          if [ ! -f "$PARAMS_FILE" ]; then
            echo "::error::No such domain '${{ inputs.domain }}' on the Snowpipe pattern (expected $PARAMS_FILE to exist)"
            exit 1
          fi
          pip install --quiet pyyaml
          python3 -c "import yaml, json; print(json.dumps(yaml.safe_load(open('${PARAMS_FILE}'))))" > params.json
          echo "database=$(jq -r .database params.json)" >> "$GITHUB_OUTPUT"
          echo "table=$(jq -r .table params.json)" >> "$GITHUB_OUTPUT"
          echo "pipe_name=$(jq -r .pipe_name params.json)" >> "$GITHUB_OUTPUT"
          echo "bucket_prefix=$(jq -r .bucket_prefix params.json)" >> "$GITHUB_OUTPUT"
          echo "user=$(jq -r .user params.json)" >> "$GITHUB_OUTPUT"
          echo "role=$(jq -r .role params.json)" >> "$GITHUB_OUTPUT"
          echo "warehouse=$(jq -r .warehouse params.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525218385225:role/data-ingestion-raw-github-oidc
          aws-region: ap-southeast-2

      - name: Upload sample CSV to S3
        run: |
          aws s3 cp sample-data/customers_sample.csv \
            "s3://data-ingestion-raw-525218385225/${{ steps.config.outputs.bucket_prefix }}customers_sample_$(date +%s).csv"

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "${{ steps.config.outputs.user }}" \
            --role "${{ steps.config.outputs.role }}" \
            --warehouse "${{ steps.config.outputs.warehouse }}" \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      - name: Refresh pipe (manual-trigger Snowpipe)
        run: snow sql -q "ALTER PIPE ${{ steps.config.outputs.database }}.RAW.${{ steps.config.outputs.pipe_name }} REFRESH;"

      # ALTER PIPE ... REFRESH is asynchronous (it queues files; COPY happens in the
      # background). Poll SYSTEM$PIPE_STATUS until pendingFileCount reaches 0 instead of
      # guessing a fixed sleep duration — a fixed `sleep 20` showed ROW_COUNT=0 on a slow
      # run during initial testing of this pipeline, which would look like a failed demo
      # on stage even though the load was simply still in flight.
      - name: Wait for Snowpipe to finish processing (poll, not a fixed sleep)
        run: |
          PIPE_FQN="${{ steps.config.outputs.database }}.RAW.${{ steps.config.outputs.pipe_name }}"
          for i in $(seq 1 24); do
            RAW_JSON=$(snow sql -q "SELECT SYSTEM\$PIPE_STATUS('${PIPE_FQN}') AS STATUS;" --format json)
            PENDING=$(echo "$RAW_JSON" | jq -r '.[0].STATUS' | jq -r '.pendingFileCount')
            echo "Attempt $i/24: pendingFileCount=$PENDING"
            if [ "$PENDING" = "0" ]; then
              echo "Snowpipe has finished processing all queued files."
              break
            fi
            sleep 5
          done
          if [ "$PENDING" != "0" ]; then
            echo "::warning::Snowpipe still reports $PENDING pending file(s) after 2 minutes of polling — the row count check below may be stale. Re-run this workflow or check SYSTEM\$PIPE_STATUS manually."
          else
            # Small safety margin: pendingFileCount can hit 0 a moment before the loaded
            # rows are actually queryable (observed once in testing: pendingFileCount=0
            # immediately followed by ROW_COUNT=0, with a retry a few seconds later
            # correctly showing the real count).
            sleep 5
          fi

      - name: Verify row count
        run: snow sql -q "SELECT COUNT(*) AS row_count FROM ${{ steps.config.outputs.database }}.RAW.${{ steps.config.outputs.table }};"
