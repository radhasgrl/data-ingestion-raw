name: Deploy Snowpipe

# Named for the ingestion *pattern* this workflow implements (Snowpipe) rather than any
# one domain — a future Openflow- or API-based ingestion domain gets its own sibling
# workflow (deploy-openflow.yml / deploy-api.yml, both already present and wired up, but
# dormant until a real domain is onboarded onto those patterns — see patterns/openflow/
# and patterns/api/). Within the Snowpipe pattern, every domain shares the exact same
# templated SQL (patterns/snowpipe/sql/*.sql) and differs only in its own
# sources/<domain>/snowpipe-params.yml — same zero-duplication principle as Repo 1's DCM
# templating.

on:
  push:
    branches: [main]
    paths:
      - "patterns/snowpipe/**"
      - "sources/**/snowpipe-params.yml"
      - ".github/workflows/deploy-snowpipe.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Only domains listed in patterns/snowpipe/active_domains.json ever get a deploy job
  # below, and only when their own sources/<domain>/snowpipe-params.yml changed (or the
  # shared patterns/snowpipe/ template did) — same mechanism as snowflake-platform-tf's
  # dcm/detect-changed-domains.sh. Keeps CI load flat as ingestion domains scale up,
  # instead of redeploying every domain's Snowpipe objects on every single push.
  detect-domains:
    name: Detect Changed Domains
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.detect.outputs.domains }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect which ingestion domains changed
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DOMAINS=$(bash detect-changed-domains.sh snowpipe ALL)
          else
            DOMAINS=$(bash detect-changed-domains.sh snowpipe "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "Domains to deploy: $DOMAINS"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Snowpipe objects (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: detect-domains
    if: needs.detect-domains.outputs.domains != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-domains.outputs.domains) }}
    # Each domain's own GitHub Environment (and therefore its own OIDC identity subject
    # claim, required reviewers, secrets) — this is what lets domains in this shared repo
    # operate independently of each other, not just share one blanket DEV-Ingest gate.
    environment:
      name: ${{ matrix.github_environment }}

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # sources/<domain>/snowpipe-params.yml is YAML (matches the plan's file-tree
      # exactly); converted to JSON once here so both this step and the deploy step can
      # read individual values via jq without a second YAML parse.
      - name: Load domain params (YAML -> JSON)
        id: config
        run: |
          PARAMS_FILE="sources/${{ matrix.name }}/snowpipe-params.yml"
          pip install --quiet pyyaml
          python3 -c "import yaml, json; print(json.dumps(yaml.safe_load(open('${PARAMS_FILE}'))))" > params.json
          echo "user=$(jq -r .user params.json)" >> "$GITHUB_OUTPUT"
          echo "role=$(jq -r .role params.json)" >> "$GITHUB_OUTPUT"
          echo "warehouse=$(jq -r .warehouse params.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      # Least-privilege: this domain's ingestion identity has exactly one role, so it's
      # specified explicitly here rather than relying on a DEFAULT_ROLE (same reasoning as
      # the dbt profile in Repo 3).
      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "${{ steps.config.outputs.user }}" \
            --role "${{ steps.config.outputs.role }}" \
            --warehouse "${{ steps.config.outputs.warehouse }}" \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      # Every file below is the exact same template for every domain
      # (patterns/snowpipe/sql/) — --enable-templating JINJA + one -D flag per
      # sources/<domain>/snowpipe-params.yml key is what makes it render this domain's
      # actual object names. Onboarding ingestion domain #2+ onto this pattern needs zero
      # new SQL, only a new snowpipe-params.yml (see README's "Onboarding a new ingestion
      # domain" section).
      - name: Deploy Snowpipe objects from template
        run: |
          D_ARGS=()
          while IFS= read -r line; do
            D_ARGS+=("-D" "$line")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' params.json)

          for f in patterns/snowpipe/sql/01_file_format.sql patterns/snowpipe/sql/02_storage_integration.sql patterns/snowpipe/sql/03_external_stage.sql patterns/snowpipe/sql/04_pipe.sql; do
            echo "::group::snow sql -f $f"
            snow sql -f "$f" --enable-templating JINJA "${D_ARGS[@]}"
            echo "::endgroup::"
          done
